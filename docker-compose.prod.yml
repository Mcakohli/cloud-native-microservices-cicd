services:
  postgres:
    restart: always

  redis:
    restart: always

  backend:
    image: ${IMAGE_BASE}/vegah-backend:${IMAGE_TAG:-latest}
    restart: always

  worker:
    image: ${IMAGE_BASE}/vegah-worker:${IMAGE_TAG:-latest}
    restart: always

  frontend:
    image: ${IMAGE_BASE}/vegah-frontend:${IMAGE_TAG:-latest}
    restart: always

  nginx:
    image: nginx:alpine
    container_name: vegah-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app-network